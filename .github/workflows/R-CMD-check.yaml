name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # R-devel, because that's what CRAN's own incoming checks run
          # against; 4.1, because that's the floor Depends: R (>= 4.1)
          # actually declares -- neither was previously exercised at all.
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: '4.1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      # setup-pandoc matters here specifically: the vignette is an .Rmd, and
      # `R CMD build` cannot render it without pandoc. The scaffold was checked
      # locally with --no-build-vignettes for exactly that reason (pandoc will
      # not build on an Intel macOS box -- Homebrew compiles it from source and a
      # Haskell dependency fails to link), which left two "inst/doc does not
      # exist" warnings unresolved. This job is what settles them.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr, any::xml2
          needs: check, coverage

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # Coverage is a riskmetric assessor in its own right (Decision 9), so it is
      # measured rather than assumed. Ubuntu release only -- one report, not five.
      #
      # Uploaded via the Codecov action rather than covr::codecov()'s own
      # uploader: that call posted straight to Codecov's legacy endpoint and
      # never inspected the response, so a rejected upload (missing token,
      # rate limit, network error) still left this job green. `fail_ci_if_error`
      # closes that gap, but is itself gated on CODECOV_TOKEN actually being
      # set -- until that secret is added to the repository, every push would
      # otherwise fail this job at the upload step. Add the secret, and this
      # starts enforcing on its own.
      - name: Generate coverage report
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: covr::to_cobertura(covr::package_coverage(), filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
