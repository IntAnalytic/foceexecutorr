name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # setup-pandoc matters here specifically: the vignette is an .Rmd, and
      # `R CMD build` cannot render it without pandoc. The scaffold was checked
      # locally with --no-build-vignettes for exactly that reason (pandoc will
      # not build on an Intel macOS box -- Homebrew compiles it from source and a
      # Haskell dependency fails to link), which left two "inst/doc does not
      # exist" warnings unresolved. This job is what settles them.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr
          needs: check, coverage

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # Coverage is a riskmetric assessor in its own right (Decision 9), so it is
      # measured rather than assumed. Ubuntu only -- one report, not three.
      - name: Test coverage
        if: matrix.config.os == 'ubuntu-latest'
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}
